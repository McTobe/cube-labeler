# Runs the Cube Labeler web app on port 8080. Point your reverse proxy
# (for example https://print.tobezone.com) at it; it handles TLS.
#
#   docker compose up -d --build

services:
  cube-labeler-web:
    build: .
    image: cube-labeler-web
    ports:
      - "8080:80"
    restart: unless-stopped
