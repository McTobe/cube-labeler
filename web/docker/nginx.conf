server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Revalidate every file, so a phone never keeps running an old version after an update
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json;

    location / {
        try_files $uri $uri/ =404;
    }

    # Staying signed in to Google Drive: web/drive_auth.py, started by the image beside nginx
    location /auth/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
}
