name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Run Automated Test Suite
        run: |
          python -m unittest discover tests

      # The GUI tests open real windows, so they only run where there is a desktop
      - name: Run Headless GUI Integration Tests
        if: runner.os == 'Windows'
        run: |
          python tests/test_gui_inventory.py
          python tests/test_gui_queue.py

  web:
    name: Web app tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the site
        run: |
          pip install pillow -c constraints.txt
          python web/build.py

      - name: Run printer.js against the Python core in Pyodide
        working-directory: web
        run: |
          npm ci
          npm test
