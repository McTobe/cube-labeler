name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Run Automated Test Suite
        run: |
          python -m unittest discover tests

      # The GUI tests open real windows, so they only run where there is a desktop
      - name: Run Headless GUI Integration Tests
        if: runner.os == 'Windows'
        run: |
          python tests/test_gui_inventory.py
          python tests/test_gui_queue.py
