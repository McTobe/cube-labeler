name: Build & Release Standalone Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install pyinstaller -c constraints.txt

      - name: Run Automated Test Suite
        run: |
          python -m unittest discover tests

      - name: Run Headless GUI Integration Tests
        run: |
          python tests/test_gui_inventory.py
          python tests/test_gui_queue.py

      - name: Compile Standalone Executable
        run: |
          python build.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: CubeLabeler-Windows-x64
          path: dist/CubeLabeler.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/CubeLabeler.exe
          name: Cube Labeler ${{ github.ref_name }}
          draft: false
          # v2.0.0-rc.1 and the like are marked as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
