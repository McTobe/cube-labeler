name: Release

# A pushed vX.Y.Z tag runs the tests and publishes the GitHub release. The web image for the tag
# is built by web-image.yml. The Windows desktop app ended with v2.4.0, so no .exe is built.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Test and publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Run Automated Test Suite
        run: |
          python -m unittest discover tests

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Cube Labeler ${{ github.ref_name }}
          draft: false
          # v2.0.0-rc.1 and the like are marked as pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
