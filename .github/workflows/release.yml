name: Build & Release Standalone Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Automated Test Suite
        run: |
          python -m unittest discover tests

      - name: Run Headless GUI Integration Tests
        run: |
          python tests/test_gui_inventory.py

      - name: Compile Standalone Executable
        run: |
          python build.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrintLabel-Windows-x64
          path: dist/PrintLabel.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/PrintLabel.exe
          name: PrintLabel Studio ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
